apiVersion: v1
kind: Service
metadata:
  name: zero-touch-api-service
  namespace: zero-touch-gitops
  labels:
    app: zero-touch-api
spec:
  type: ClusterIP # Internal cluster load balancer
  ports:
    - port: 80 # The port other services talk to
      targetPort: 3000 # The internal container port where Node.js listens
      protocol: TCP
      name: http
  selector:
    # Route traffic only to pods with the label "app: zero-touch-api"
    app: zero-touch-api
